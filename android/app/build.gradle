apply plugin: 'com.android.application'

// Release bundles sign with the upload key from the login keychain
// (docs/store-screenshots.md › Keys): the keystore, base64, in
// "scotdance-upload-keystore", and its alias (the account) and password in
// "scotdance-upload-key". Nobody types them, and the keystore is only ever
// a file in build/. Without them (CI, another Mac) bundles build unsigned.
def uploadKey = { ->
    def find = { String service, List flags ->
        def p = (['security', 'find-generic-password', '-s', service] + flags).execute()
        def out = p.text
        p.waitFor() == 0 ? out.trim() : null
    }
    try {
        def keystore = find('scotdance-upload-keystore', ['-w'])
        def password = find('scotdance-upload-key', ['-w'])
        def alias = (find('scotdance-upload-key', []) =~ /"acct"<blob>="([^"]+)"/).with { it.find() ? it.group(1) : null }
        if (!keystore || !password || !alias) return null
        def store = layout.buildDirectory.file('upload.keystore').get().asFile
        store.parentFile.mkdirs()
        store.bytes = keystore.decodeBase64()
        store.setReadable(false, false)
        store.setReadable(true, true)
        [store: store, alias: alias, password: password]
    } catch (ignored) {
        null // no keychain here
    }
}()

android {
    namespace = "info.mismith.scotdance"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "info.mismith.scotdance"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4000006
        versionName "4.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        if (uploadKey) {
            release {
                storeFile uploadKey.store
                storePassword uploadKey.password
                keyAlias uploadKey.alias
                keyPassword uploadKey.password
            }
        }
    }
    buildTypes {
        release {
            if (uploadKey) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.warn("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}