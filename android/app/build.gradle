apply plugin: 'com.android.application'

// Release bundles sign with the upload key when the login keychain has a
// "scotdance-upload-key" item (account: the key's alias, password: its
// password; docs/v4-release-runbook.md › New beta builds), so nobody types
// it. Without one (CI, another Mac) they build unsigned.
def uploadKey = { ->
    def find = { List flags ->
        def p = (['security', 'find-generic-password', '-s', 'scotdance-upload-key'] + flags).execute()
        def out = p.text
        p.waitFor() == 0 ? out : null
    }
    try {
        def store = new File(System.getProperty('user.home'), 'Documents/ScotDance/certs/scotdance.keystore')
        def alias = (find([]) =~ /"acct"<blob>="([^"]+)"/).with { it.find() ? it.group(1) : null }
        def password = find(['-w'])?.trim()
        store.exists() && alias && password ? [store: store, alias: alias, password: password] : null
    } catch (ignored) {
        null // no keychain here
    }
}()

android {
    namespace = "info.mismith.scotdance"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "info.mismith.scotdance"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4000001
        versionName "4.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        if (uploadKey) {
            release {
                storeFile uploadKey.store
                storePassword uploadKey.password
                keyAlias uploadKey.alias
                keyPassword uploadKey.password
            }
        }
    }
    buildTypes {
        release {
            if (uploadKey) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.warn("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}